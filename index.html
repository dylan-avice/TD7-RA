<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TD7 - RA : Marker Based</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- On importe la version AR.js pour les marqueurs -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin : 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- 1. Marqueur Hiro classique (modèle du dinosaure de la doc) -->
      <a-marker preset="hiro">
        <a-entity
          position="0 0 0"
          scale="0.05 0.05 0.05"
          gltf-model="https://raw.githack.com/AR-js-org/AR.js/master/aframe/examples/image-tracking/nft/trex/scene.gltf"
        ></a-entity>
      </a-marker>

      <!-- 2. Votre marqueur personnalisé (affiche votre monkey.gltf) -->
      <a-marker type="pattern" url="pattern-monmarqueur.patt">
        <a-entity
          position="0 0 0"
          scale="0.3 0.3 0.3"
          gltf-model="monkey.gltf"
        ></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
